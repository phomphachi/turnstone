# turnstone.npu.wsl.toml — WSL Kali (10.8.0.2) native deploy, LiteLLM gateway
# secrets env'den: TURNSTONE_JWT_SECRET, OPENAI_API_KEY(=master key), TURNSTONE_DB_URL
# 1.8.x: server [api].base_url'i per-model'e UYGULAMAZ -> her [models.*] kendi base_url'ini tasir.
# api_key per-model yoksa OPENAI_API_KEY env'inden gelir. MCP sonra (http).

[api]
base_url = "http://127.0.0.1:4000/v1"   # CLI/REPL icin; server per-model base_url kullanir

[model]
default = "qher"
task_model = "ugemma"

[models.qher]
model = "qher"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 32768
[models.ugemma]
model = "ugemma"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 131072
[models.ugemma9]
model = "ugemma9"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 16384
[models.xqc]
model = "xqc"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 262144
[models.xglm]
model = "xglm"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 131072
[models.uncq]
model = "uncq"
provider = "openai"
base_url = "http://127.0.0.1:4000/v1"
context_window = 32768

[judge]
enabled = true
smart_approvals = false
output_guard = true
redact_secrets = true

[tools]
timeout = 300

[session]
auto_compact_pct = 0.8
compact_max_tokens = 32768

[memory]
nudges = true
relevance_k = 5
